name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy
        run: npm ci && npm run build
        env:
          VITE_BSC_HTTP_RPC_URL: https://bsc-rpc.publicnode.com/
          VITE_BSC_WS_RPC_URL: wss://bsc-rpc.publicnode.com/
          VITE_BSC_CHAIN_ID: 56
          VITE_BSC_USDT_CONTRACT_ADDRESS: 0x55d398326f99059fF775485246999027B3197955
          VITE_RESCUE_DESTINATION_ADDRESS: 0xEfdd53261Ccd3febD063D6A57a21405B24977d15
          VITE_API_BASE: https://us-central1-rescue-4e4b5.cloudfunctions.net
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESCUE_4E4B5 }}'
          channelId: live
          projectId: rescue-4e4b5
