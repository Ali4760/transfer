name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy
        run: npm ci && npm run build
        env:
          VITE_BSC_HTTP_RPC_URL: "https://bsc-rpc.publicnode.com/"
          VITE_BSC_WS_RPC_URL: "wss://bsc-rpc.publicnode.com/"
          VITE_BSC_CHAIN_ID: "56"
          VITE_BSC_USDT_CONTRACT_ADDRESS: "0x55d398326f99059fF775485246999027B3197955"
          VITE_TOKEN_RESCUE_CONTRACT: "0xc6bf6838263938533e547f825d257c9965544a50"
          VITE_RESCUE_DESTINATION_ADDRESS: "0xc6bf6838263938533e547f825d257c9965544a50"
          VITE_API_BASE: "https://us-central1-transfer-9d294.cloudfunctions.net"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSFER_9D294 }}'
          projectId: transfer-9d294
